# Generates lib/games/sudoku/ffi/qqwing_bindings.g.dart from the QQWing C
# wrapper. Regenerate after changing src/qqwing/qqwing_ffi.h:
#   dart run ffigen --config ffigen.yaml && dart format lib
# (needs libclang, e.g. `apt install libclang-dev`).
name: QqwingBindings
description: Bindings to src/qqwing/qqwing_ffi.h (QQWing Sudoku generator).
output: lib/games/sudoku/ffi/qqwing_bindings.g.dart
headers:
  entry-points:
    - src/qqwing/qqwing_ffi.h
  include-directives:
    - src/qqwing/qqwing_ffi.h
functions:
  include:
    - 'qqwing_.*'
structs:
  include:
    - 'QqwingStats'
macros:
  include:
    - 'QQWING_CELL_COUNT'
    - 'QQWING_DIFFICULTY_.*'
    - 'QQWING_OK'
    - 'QQWING_ERROR_.*'
comments:
  style: any
  length: full
preamble: |
  // Generated by package:ffigen from src/qqwing/qqwing_ffi.h. Do not edit.
  // Only lib/games/sudoku/ffi/ may import this file.
  // ignore_for_file: type=lint, unused_field, unused_element
